# DEP-02: merging to main runs CI; deploy only happens if CI passes.
# All third-party HTTP is mocked here and no provider keys are needed.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # NFR-MNT-02
      - name: Lint
        run: ruff check .

      # --fail-level WARNING: `check --deploy` exits 0 on warnings, so without
      # it the gate printed security.W009 (weak SECRET_KEY) and passed anyway.
      - name: Django deployment checks
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          # At least 50 characters, or security.W009 fails the step.
          SECRET_KEY: ci-only-secret-key-not-used-for-anything-anywhere-ever
          DEBUG: 'False'
          ALLOWED_HOSTS: example.com
          CORS_ALLOWED_ORIGINS: https://example.com

      # NFR-MNT-01: engine and log builder >= 90%, overall backend >= 75%.
      - name: Tests with coverage
        run: |
          pytest --cov=planner --cov-report=term-missing --cov-report=xml
          coverage report --include="planner/hos/engine.py,planner/hos/logbuilder.py" --fail-under=90
          coverage report --omit="planner/tests/*" --fail-under=75

  frontend:
    name: Frontend (lint + types + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc -b --force

      - name: Build
        run: npm run build

      - name: Check initial JS budget
        # NFR-PERF-04: initial JS must stay at or under 350 KB gzipped.
        run: node ../scripts/check-bundle-size.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      # AC-10 / NFR-SEC-02
      - name: Scan bundle and repository for provider keys
        run: node scripts/scan-secrets.mjs
