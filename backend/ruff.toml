line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008", "RUF012"]

[lint.per-file-ignores]
# Tests favour explicit, literal fixtures over the terser idioms.
"planner/tests/*" = ["E501", "C408", "RUF015", "RUF046", "RUF007"]
"config/settings_test.py" = ["F403", "F405"]
