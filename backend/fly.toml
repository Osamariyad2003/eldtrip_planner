# fly.toml app configuration file generated for elp-trip on 2026-10-08T20:26:54+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'elp-trip'
primary_region = 'fra'
console_command = '/code/manage.py shell'

[build]

[env]
  PORT = '8000'
  DEBUG = 'False'
  # Django refuses any request whose Host is not listed here: without the Fly
  # hostname every request comes back 400 DisallowedHost.
  ALLOWED_HOSTS = 'elp-trip.fly.dev'
  # API-06: the browser origins allowed to call this API. Add the deployed
  # frontend origin here once it exists.
  CORS_ALLOWED_ORIGINS = 'http://localhost:5173'
  NOMINATIM_USER_AGENT = 'eld-trip-planner/1.0 (+https://elp-trip.fly.dev)'

# SECRET_KEY and ORS_API_KEY are not here on purpose - they are secrets:
#   fly secrets set SECRET_KEY=... ORS_API_KEY=...

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024

# STATIC_ROOT in settings.py is /code/staticfiles, which is what collectstatic
# writes and therefore what Fly should serve. The API returns JSON only, so
# this serves nothing today; it is here so the path is right if it ever does.
[[statics]]
  guest_path = '/code/staticfiles'
  url_prefix = '/static/'
