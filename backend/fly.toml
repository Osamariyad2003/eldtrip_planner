# fly.toml app configuration file generated for elp-trip-withered-stone-5393 on 2026-10-08T20:34:14+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'elp-trip'
primary_region = 'fra'
console_command = '/code/manage.py shell'

[build]
[env]
  ALLOWED_HOSTS = 'elp-trip.fly.dev'
  # API-06: the Vercel production aliases plus the local dev server. Preview
  # deployments get a per-deploy hostname, matched by the regex below.
  CORS_ALLOWED_ORIGINS = 'https://eldtrip-planner.vercel.app,https://eldtrip-planner-osamariyad2003s-projects.vercel.app,https://eldtrip-planner-git-main-osamariyad2003s-projects.vercel.app,http://localhost:5173'
  CORS_ALLOWED_ORIGIN_REGEXES = '^https://eldtrip-planner-[a-z0-9]+-osamariyad2003s-projects\.vercel\.app$'
  DEBUG = 'False'
  NOMINATIM_USER_AGENT = 'eld-trip-planner/1.0 (+https://elp-trip.fly.dev)'
  PORT = '8000'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[[statics]]
  guest_path = '/code/staticfiles'
  url_prefix = '/static/'
